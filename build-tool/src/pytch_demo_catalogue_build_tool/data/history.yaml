# Declarative demo history used to build a throwaway test repo.
#
# Consumed by repo_builder.py.  See that module's docstring for how
# `commits` is interpreted (listing order, `parents`, `ops`, `branch`).
#
# Every op has an explicit `kind` selecting the operation:
#   {kind: put,    demo: <dir>, uuid: <alias>, ...}   create/replace a demo
#   {kind: delete, demo: <dir>}                        remove a demo
#   {kind: move,   from: <dir>, to: <dir>}             relocate a demo
#
# A `put` defaults its demo's description.md to the commit `message`, so a
# built demo's description identifies the commit that defined it; pass an
# explicit `description` where two commits must share one (e.g. a change to
# only `recommended` must not alter content).  `programKind` (required, no
# default) selects which project template in this package's data/ dir the
# demo is built from.  `chapters` (default 1) sets how many `#`-headed
# chapters description.md has, `video: true` adds a video thumbnail, and
# `assets: true` adds a content-assets directory (shared between the demo's
# locales by symlink); all are content, so paired commits that must not
# count as a change have to agree on them too.
#
# `uuids` gives short aliases so the rest of the file stays readable; an
# alias is resolved to its uuid wherever a uuid is expected (in `ops` and
# in `scenarios`).  `latest: null` in a scenario means "no live version".

uuids:
  live:   "11111111-1111-4111-8111-111111111111"
  superA: "22222222-2222-4222-8222-222222222222"
  superB: "33333333-3333-4333-8333-333333333333"
  gone:   "44444444-4444-4444-8444-444444444444"
  chainA: "55555555-5555-4555-8555-555555555555"
  chainB: "66666666-6666-4666-8666-666666666666"
  mover:  "77777777-7777-4777-8777-777777777777"
  descr:  "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
  beacon: "bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb"
  ambV1:  "88888888-8888-4888-8888-888888888888"
  ambV2:  "99999999-9999-4999-8999-999999999999"

# --- The main catalogue history (linear) -------------------------------
commits:
  - id: add-live
    branch: catalogue
    message: "Add a plain live demo"
    ops:
      # A per-method program, so its (present-at-head) project zip exercises
      # the per-method template, including its asset file.  description is
      # fixed so the later recommended-flip is a no-op on content.
      - {kind: put, demo: snake, uuid: live, programKind: per-method,
         description: "The snake demo"}

  - id: add-superA
    branch: catalogue
    message: "Add a demo that will later be superseded"
    ops:
      - {kind: put, demo: flowers, uuid: superA, programKind: flat}

  - id: supersede-super
    branch: catalogue
    message: "Release a new major version of the flowers demo"
    ops:
      # Same directory, new uuid in place -> a major-version chain link.
      # A multi-chapter description plus a video thumbnail, so the front end
      # has a live demo exercising both.
      - {kind: put, demo: flowers, uuid: superB, programKind: flat,
         chapters: 3, video: true}

  - id: add-gone
    branch: catalogue
    message: "Add a demo that will be deleted outright"
    ops:
      - {kind: put, demo: doomed, uuid: gone, programKind: flat}

  - id: del-gone
    branch: catalogue
    message: "Delete the doomed demo (latestUuid should become null)"
    ops:
      - {kind: delete, demo: doomed}

  - id: add-chainA
    branch: catalogue
    message: "Add a demo that will be superseded and then the chain deleted"
    ops:
      - {kind: put, demo: relic, uuid: chainA, programKind: flat}

  - id: supersede-chain
    branch: catalogue
    message: "Release a new major version of the relic demo"
    ops:
      - {kind: put, demo: relic, uuid: chainB, programKind: flat}

  - id: del-chain
    branch: catalogue
    message: "Delete the relic demo entirely (whole chain -> null)"
    ops:
      - {kind: delete, demo: relic}

  - id: toggle-live
    branch: catalogue
    message: "Flip the snake demo's recommended flag (defining, but NOT mtime)"
    ops:
      # Identical to add-live except the recommended flag.  This
      # becomes the snake demo's DEFINING commit -- but it should not
      # advance the effective mtime, which stays at add-live.
      - {kind: put, demo: snake, uuid: live, programKind: per-method,
         description: "The snake demo", recommended: false}

  - id: add-mover
    branch: catalogue
    message: "Add a demo that will later be moved within the tree"
    ops:
      # Single-chapter, but with a video thumbnail: a live demo covering the
      # single-chapter + video combination.  (The later move does not rewrite
      # content, so the video survives to head.)
      - {kind: put, demo: rover, uuid: mover, programKind: flat, video: true}

  - id: move-mover
    branch: catalogue
    message: "Reorganise: move the rover demo (must NOT count as a change)"
    ops:
      - {kind: move, from: rover, to: animations/rover}

  - id: add-beacon
    branch: catalogue
    message: "Add the beacon demo"
    ops:
      # Explicit description so the later content edit is a real change and
      # the recommended-only flip after it is not.
      - {kind: put, demo: beacon, uuid: beacon, programKind: flat,
         description: "The beacon demo, v1"}

  - id: edit-beacon
    branch: catalogue
    message: "Edit the beacon demo's description (a content change)"
    ops:
      # A true content change (new description text and an extra
      # chapter) relative to add-beacon, so this is both the defining
      # and the effective-mtime commit -- until recommend-beacon takes
      # over the former but not the latter.
      - {kind: put, demo: beacon, uuid: beacon, programKind: flat,
         description: "The beacon demo, v2", chapters: 2}

  - id: recommend-beacon
    branch: catalogue
    message: "Flip the beacon demo's recommended flag (defining, but NOT mtime)"
    ops:
      # Same content as edit-beacon (same description and chapters);
      # only the "recommended" flag differs.  So this becomes the
      # DEFINING commit, but it should not advance the effective
      # modification time, which stays at edit-beacon.
      - {kind: put, demo: beacon, uuid: beacon, programKind: flat,
         description: "The beacon demo, v2", chapters: 2, recommended: false}

  - id: add-story
    branch: catalogue
    message: "Add the story demo"
    ops:
      - {kind: put, demo: story, uuid: descr, programKind: flat}

  - id: reword-story
    branch: catalogue
    message: "Reword the story demo's description (a content change)"
    ops:
      # Same uuid/project; only description.md changes -> a modification, so
      # this becomes the demo's defining commit.  The reworded description is
      # multi-chapter (and add-story's was single), itself a content change.
      - {kind: put, demo: story, uuid: descr, programKind: flat, chapters: 2}

# --- A non-linear history that is ambiguous (old-versions.md example) ---
#
#   A -> B -> C -> D ----+-> G -> H        (branch: ambiguous)
#         \             /
#          +-> E -> F -+
#
# C and E make *different* edits to demo ambV1; D and F both upgrade it to
# an identical ambV2.  "The most recent state" of ambV1 is undefined, so
# constructing the extractor must raise.
  - id: amb-A
    parents: []
    message: "A: introduce the ambiguous demo"
    ops:
      - {kind: put, demo: amb, uuid: ambV1, programKind: flat}

  - id: amb-B
    parents: [amb-A]
    message: "B: no change to the demo"

  - id: amb-C
    parents: [amb-B]
    message: "C: one edit to the demo"
    ops:
      # description defaults to this commit's message, differing from E's.
      - {kind: put, demo: amb, uuid: ambV1, programKind: flat}

  - id: amb-D
    parents: [amb-C]
    message: "D: upgrade to the new major version"
    ops:
      # Explicit description so D's and F's ambV2 are byte-identical.
      - {kind: put, demo: amb, uuid: ambV2, description: "The amb demo, v2", programKind: flat}

  - id: amb-E
    parents: [amb-B]
    message: "E: a different edit to the demo"
    ops:
      - {kind: put, demo: amb, uuid: ambV1, programKind: flat}

  - id: amb-F
    parents: [amb-E]
    message: "F: upgrade to the (identical) new major version"
    ops:
      - {kind: put, demo: amb, uuid: ambV2, description: "The amb demo, v2", programKind: flat}

  - id: amb-G
    parents: [amb-D, amb-F]
    message: "G: merge the two branches"

  - id: amb-H
    parents: [amb-G]
    branch: ambiguous
    message: "H: tip of the ambiguous history"

# --- What each branch's extracted records should look like -------------
scenarios:
  - start_ref: catalogue
    expect:
      # `defined_at` is the most recent commit making ANY change to
      # the demo (including just a "recommended" flip); `mtime_at` is
      # the most recent change OTHER than just to the "recommended"
      # flag.  The two differ exactly for the demos whose latest touch
      # is a "recommended" flip: `live` (its mtime stays at the add)
      # and `beacon` (mtime is content edit that precedes the flip).
      live:   {latest: live,   present: true,  defined_at: toggle-live,
               mtime_at: add-live, program_kind: per-method}
      superA: {latest: superB, present: false, defined_at: add-superA,
               mtime_at: add-superA, program_kind: flat}
      superB: {latest: superB, present: true,  defined_at: supersede-super,
               mtime_at: supersede-super}
      gone:   {latest: null,   present: false}
      chainA: {latest: null,   present: false}
      chainB: {latest: null,   present: false}
      mover:  {latest: mover,  present: true,  defined_at: add-mover,
               mtime_at: add-mover}
      descr:  {latest: descr,  present: true,  defined_at: reword-story,
               mtime_at: reword-story}
      beacon: {latest: beacon, present: true,  defined_at: recommend-beacon,
               mtime_at: edit-beacon, program_kind: flat}

  - start_ref: ambiguous
    expect_error: true

# --- Bulk live demos for front-end pagination tests --------------------
#
# Hand-writing these would be unreadable, so repo_builder expands this
# section into `count` live demos for every (programKind, demoKind)
# combination -- here 25 x 2 x 2 = 100 demos -- each its own commit chained
# onto `after` and advancing the `branch`, so they all join that branch's
# catalogue index.  Their uuids are derived deterministically from the demo
# name, so the built dist is stable across runs.
bulk:
  after: reword-story
  branch: catalogue
  count: 25
  programKinds: [flat, per-method]
  demoKinds: [game, snippet]
